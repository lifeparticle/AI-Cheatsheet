name: Update Marketing Data

on:
  workflow_dispatch:
  # schedule:
  # Runs at 08:00 every Monday.
  # - cron: "0 8 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  update_marketing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "marketing-agent/requirements.txt" anthropic

      - name: Generate marketing JSON
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python "marketing-agent/main.py"

      - name: Commit, push branch, and open PR if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          # Use a unique branch per workflow run to avoid conflicts on re-runs.
          BRANCH="update-marketing-data-$(date +'%Y-%m-%d')-${{ github.run_id }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add "marketing-data/data.json" "timeline/public/marketing-data.json"
          git commit -m "Update marketing data"

          git push -u origin "$BRANCH"

          # Creating PRs from GITHUB_TOKEN can be blocked by repo/org settings
          # ("GitHub Actions is not permitted to create or approve pull requests").
          # We still push the branch and provide a URL to open the PR manually.
          if gh pr view "$BRANCH" --json url -q .url >/dev/null 2>&1; then
            echo "Pull request already exists."
            gh pr view "$BRANCH" --json url -q .url
          elif gh pr create \
              --title "Update marketing data $(date +'%Y-%m-%d')" \
              --body "Automated marketing/brand intelligence update generated by the marketing agent." \
              --base main \
              --head "$BRANCH"; then
            echo "Pull request created."
          else
            echo "Pull request creation was blocked by GitHub settings."
            echo "Open it manually:"
            echo "https://github.com/${{ github.repository }}/pull/new/$BRANCH"
          fi

